<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>회원가입</title>
    <link rel="stylesheet" href="/css/app.css"/>
    <link rel="stylesheet" href="/css/signup.css"/>
</head>
<body>
    <div class="container">
        <div class="signup-container">
            <!-- 상단 로고 영역 -->
            <header class="signup-header">
                <h1 class="logo-text">
                    <a href="../index.html">문득</a>
                </h1>
            </header>

            <!-- 메인 회원가입 영역 -->
            <div class="signup-content">
                <!-- 환영 문구 -->
                <h2 class="welcome-text">
                    문화생활 기록의 시작!<br>
                    문득에 오신 것을 환영해요.
                </h2>

                <!-- 이메일 회원가입 버튼 (페이지 이동을 위해 a 태그 사용) -->
                <a href="signup-email.html" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="email-icon">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    이메일로 회원가입
                </a>

                <!-- 로그인 안내 영역 -->
                <div class="login-prompt-area">
                    이미 계정이 있으신가요? <a href="login.html" class="login-link">로그인</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
