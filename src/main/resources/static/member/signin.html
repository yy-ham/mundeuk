<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인</title>
    <link rel="stylesheet" href="/css/app.css"/>
    <link rel="stylesheet" href="/css/signin.css"/>
</head>
<body>
    <div class="container">

        <div class="login-container">
          <!-- 상단 로고 영역 -->
          <header class="login-header">
            <h1 class="logo-text">
              <a href="../index.html">문득</a>
            </h1>
          </header>

          <!-- 메인 로그인 영역 -->
          <div class="login-content">
            <h2 class="login-title">로그인</h2>

            <!-- 이메일 로그인 버튼 (유일한 로그인 수단이므로 메인 컬러로 강조) -->
            <a href="signin-email.html" class="btn-login email-login">
              <svg viewBox="0 0 24 24" fill="currentColor" class="email-icon">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
              이메일로 로그인
            </a>

            <!-- 회원가입 안내 영역 -->
            <div class="signup-area">
              아직 회원이 아니신가요? <a href="signup.html" class="signup-link">회원가입</a>
            </div>
          </div>
        </div>

    </div>

</body>
</html>
