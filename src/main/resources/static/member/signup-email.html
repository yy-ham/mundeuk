<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이메일로 회원가입</title>
    <link rel="stylesheet" href="/css/app.css"/>
    <link rel="stylesheet" href="/css/signup-email.css"/>
</head>
<body>
    <div class="container">
      <div class="email-signup-container">
        <!-- 상단 뒤로가기 헤더 -->
        <header class="header">
          <button type="button" class="btn-back" onclick="history.back()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
          </button>
        </header>

        <main class="signup-body">
          <h1 class="page-title">이메일 가입하기</h1>

          <form class="signup-form">
            <!-- 이메일 입력 그룹 -->
            <div class="form-group">
              <label class="input-label">이메일<span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="email" id="email" class="input-field" >
                <div class="icon-group">

<!--                  </svg>-->
                </div>
              </div>
            </div>

            <!-- 비밀번호 입력 그룹 -->
            <div class="form-group password-group">
              <label class="input-label">비밀번호<span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="password" id="password" class="input-field">
                <div class="icon-group">

<!--                  </svg>-->
<!--                  <svg class="icon-eye-slash" viewBox="0 0 24 24" width="20" height="20" fill="#a0a0a0">-->
<!--                    <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>-->
<!--                  </svg>-->
                </div>
              </div>
              <p class="helper-text">영문, 숫자, 특수문자 중 2개 조합 10자리 이상 입력</p>
            </div>

            <!-- 닉네임 입력 그룹 -->
            <div class="form-group">
              <label class="input-label">닉네임<span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="text" id="nickname" class="input-field">
                <div class="icon-group">

<!--                    <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>-->
