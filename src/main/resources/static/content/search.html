<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>검색</title>
    <link rel="stylesheet" href="../css/app.css"/>
    <link rel="stylesheet" href="../css/search.css"/>
</head>
<body>
    <div class="container">
        <!-- 상단 검색창 -->
        <div class="search-header">
            <div class="search-input-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="keyword" class="search-input">
                <button class="clear-btn"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
            </div>
            <button class="search-btn">검색</button>
        </div>

        <!-- 탭 메뉴 -->
        <div class="search-tabs">
            <div class="tab active" data-target="tab-all">통합</div>
            <div class="tab" data-target="tab-book">책</div>
            <div class="tab" data-target="tab-movie">영화</div>
            <div class="tab" data-target="tab-tv">TV</div>
        </div>

        <!-- 검색 결과 영역 -->
        <div class="search-content">
            <!-- 책 검색 결과 -->
            <div class="category-section" id="book-section">
                <div class="category-header">
                    <h2>책</h2>
                    <span class="more-link" id="header-more-btn">더보기</span>
                </div>

                <ul class="result-list" id="book-list">
                    <!-- JS에서 렌더링 -->
                </ul>

                <!-- 하단 더보기 버튼 -->
                <div class="load-more-container" id="bottom-load-more" style="display: none;">
                    <button class="load-more-btn">
                        더보기
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 바-->
        <nav class="bottom-nav">
            <a href="../index.html" class="nav-item">
                <!-- 홈 아이콘 -->
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>홈</span>
            </a>
            <a href="/content/search.html" class="nav-item active">
                <!-- 검색 아이콘 -->
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>검색</span>
            </a>
            <a href="/member/signin.html" id="profile-link" class="nav-item">
                <!-- 로그인/마이페이지 아이콘 -->
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span id="profile-text">로그인</span>
            </a>
        </nav>
    </div>

    <script src="/js/search.js"></script>
</body>
</html>
